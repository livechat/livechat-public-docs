---
openapi: 3.0.0
info:
  title: Customer Data Platform API
  description: Customer Data Platform API is a service for collecting, storing, and
    managing end-user data.
  version: 0.0.1
servers:
- url: https://api.text.com/cdp
paths:
  "/get_customer":
    post:
      summary: Get customer
      description: 'Returns the customer data. Required scope: `customers:ro`.'
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The requested customer ID.
      responses:
        '200':
          description: Customer data.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '404':
          description: Customer not found
        '422':
          description: Invalid request body
        '500':
          description: Internal error
  "/get_merged_customer":
    post:
      summary: Get merged customer
      description: |-
        Returns the merged customer data.

        Required scope: `customers:ro`.
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The requested customer ID.
      responses:
        '200':
          description: Merged customer data.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '404':
          description: Customer not found
        '422':
          description: Invalid request body
        '500':
          description: Internal error
  "/get_merged_customer_chats":
    post:
      summary: Get merged customer chat IDs
      description: |-
        Returns the merged customer chat IDs.

        Required scope: `customers:ro`.
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customer_id
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The requested customer ID.
      responses:
        '200':
          description: Array of chat IDs for the merged customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chat_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    description: The chat IDs associated with the merged customer.
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '404':
          description: Customer not found
        '422':
          description: Invalid request body
        '500':
          description: Internal error
  "/get_merged_customer_tickets":
    post:
      summary: Get merged customer ticket IDs
      description: |-
        Returns the merged customer ticket IDs.

        Required scope: `customers:ro`.
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customer_id
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The requested customer ID.
                silo:
                  type: string
                  enum:
                  - inbox
                  - archive
                  - spam
                  - trash
                  description: The ticket silo to filter by.
      responses:
        '200':
          description: Array of ticket IDs for the merged customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    description: The ticket IDs associated with the merged customer.
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '404':
          description: Customer not found
        '422':
          description: Invalid request body
        '500':
          description: Internal error
  "/v1/list_customers":
    post:
      summary: v1/List customers
      description: 'Available for Text App only. Search and list customers with filtering,
        sorting, and pagination. Required scope: `customers:ro`.'
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListCustomersRequest"
            examples:
              simple_search:
                summary: Simple free-text search
                value:
                  query: john
                  results_per_page: 50
              advanced_filters:
                summary: Advanced filtering with multiple criteria
                value:
                  query: john
                  filters:
                  - operator: AND
                    clauses:
                    - field: name
                      operator: contains
                      values:
                      - john
                      - jane
                    - field: country
                      operator: is
                      values:
                      - Poland
                      - Latvia
                      negate: true
                    - field: last_activity
                      operator: range
                      range:
                        from: '2025-01-01T00:00:00Z'
                        to: '2025-03-01T00:00:00Z'
                    - field: threads_count
                      operator: range
                      range:
                        from: 50
                        to: 100
                    - field: tickets_count
                      operator: is
                      values:
                      - 10
                  results_per_page: 50
                  sort:
                    last_activity: desc
                    9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11: asc
              filter_groups_example:
                summary: Multiple filter groups with OR logic
                value:
                  filters:
                  - operator: AND
                    clauses:
                    - field: email
                      operator: is
                      values:
                      - user@example.com
                    - field: threads_count
                      operator: range
                      range:
                        from: 10
                        to: 100
                  - operator: OR
                    clauses:
                    - field: name
                      operator: exists
                    - field: phone_number
                      operator: starts_with
                      values:
                      - "+48"
                      - "+121"
                  results_per_page: 25
              cart_filters:
                summary: Filter by cart value and last updated date
                value:
                  filters:
                  - operator: AND
                    clauses:
                    - field: cart_total_usd
                      operator: range
                      range:
                        from: 100
                        to: 500
                    - field: cart_last_updated_at
                      operator: range
                      range:
                        from: '2025-01-01T00:00:00Z'
                        to: '2025-03-01T00:00:00Z'
                  results_per_page: 50
              segment_membership:
                summary: Customers in segment 5
                value:
                  filters:
                  - operator: AND
                    clauses:
                    - field: segment_id
                      operator: is
                      values:
                      - 5
              any_segment_membership:
                summary: Customers in segment 5 or 7
                value:
                  filters:
                  - operator: AND
                    clauses:
                    - field: segment_id
                      operator: is
                      values:
                      - 5
                      - 7
              all_segment_memberships:
                summary: Customers in both segment 5 and segment 7
                value:
                  filters:
                  - operator: AND
                    clauses:
                    - field: segment_id
                      operator: is
                      values:
                      - 5
                    - field: segment_id
                      operator: is
                      values:
                      - 7
              neither_segment_membership:
                summary: Customers in neither segment 5 nor segment 7
                value:
                  filters:
                  - operator: AND
                    clauses:
                    - field: segment_id
                      operator: is
                      values:
                      - 5
                      - 7
                      negate: true
              segment_membership_entered_at:
                summary: Customers who joined segment 5 on or after 1 August 2026
                value:
                  filters:
                  - operator: AND
                    clauses:
                    - field: segment_id
                      operator: is
                      values:
                      - 5
                      entered_at:
                        from: '2026-08-01T00:00:00Z'
              any_segment_membership_entered_at:
                summary: Customers who joined any segment within a date range
                value:
                  filters:
                  - operator: AND
                    clauses:
                    - field: segment_id
                      operator: is
                      entered_at:
                        from: '2026-07-30T00:00:00Z'
                        to: '2026-08-06T00:00:00Z'
      responses:
        '200':
          description: A list of customers matching search criteria.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCustomersResponse"
              example:
                customers:
                - customer_id: cf89fa3a-5ee9-4bdb-84ec-38824b2e2786
                  organization_id: b7eff798-f8df-4364-8052-649c35c9ed0c
                  product: livechat
                  cluster_id: cf89fa3a-5ee9-4bdb-84ec-38824b2e2786
                  is_master: false
                  child_sources:
                  - monitoring
                  monitoring: 
                  custom_fields: 
                  statistics: 
                next_page_id: '2'
                total: 1523
                page_id: '1'
        '400':
          description: Invalid request (validation error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'validation error: invalid field ''city''. Allowed fields:
                      address_city, address_country, ... and customer_property'
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '422':
          description: Invalid request body
        '500':
          description: Internal error
  "/v1/get_customers_count":
    post:
      summary: v1/Get customers count
      description: |-
        Returns a count of customers matching the specified search criteria.

        The request accepts the same `query` and `filters` fields as the `List customers` method. Required scope: `customers:ro`.
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetCustomersCountRequest"
      responses:
        '200':
          description: The count of customers matching search criteria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int64
                    example: 1523
        '400':
          description: Invalid request (validation error)
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '422':
          description: Invalid request body
        '500':
          description: Internal error
  "/v1/create_customer_property_definition":
    post:
      summary: v1/Create customer property definition
      description: |-
        Creates a customer property definition for the organization.

        The organization's plan determines the maximum number of customer properties. Required scope: `customers:rw`.
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateCustomerPropertyRequest"
            examples:
              number_property:
                summary: Numeric property
                value:
                  name: lifetime_value
                  type: number
                  description: Lifetime spend in USD
              timestamp_property:
                summary: Timestamp property with a format
                value:
                  name: signed_up_at
                  type: timestamp
                  type_configuration:
                    format: date-time
      responses:
        '200':
          description: The created customer property definition.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerProperty"
              examples:
                number_property:
                  summary: Numeric property (no type_configuration)
                  value:
                    id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                    name: lifetime_value
                    type: number
                    type_configuration: {}
                    description: Lifetime spend in USD
                    has_value: false
                timestamp_property:
                  summary: Timestamp property with a format
                  value:
                    id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                    name: signed_up_at
                    type: timestamp
                    type_configuration:
                      format: date-time
                    has_value: false
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '409':
          description: A property with the same name already exists in the organization.
        '422':
          description: Invalid request body or the organization's plan-based customer
            property limit has been reached.
        '500':
          description: Internal error
  "/v1/update_customer_property_definition":
    post:
      summary: v1/Update customer property definition
      description: 'Updates the editable fields of a customer property definition.
        Required scope: `customers:rw`.'
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateCustomerPropertyRequest"
            examples:
              renamed:
                summary: Rename a numeric property
                value:
                  id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                  name: ltv_usd
                  description: Lifetime value (USD)
              timestamp_property:
                summary: Update a timestamp property's allowed values
                value:
                  id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                  type_configuration:
                    allowed_values:
                    - '2026-01-01T00:00:00Z'
      responses:
        '200':
          description: The updated customer property definition.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerProperty"
              examples:
                renamed:
                  summary: Renamed numeric property
                  value:
                    id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                    name: ltv_usd
                    type: number
                    type_configuration: {}
                    description: Lifetime value (USD)
                    has_value: true
                timestamp_property:
                  summary: Timestamp property after updating its allowed values
                  value:
                    id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                    name: signed_up_at
                    type: timestamp
                    type_configuration:
                      format: date-time
                      allowed_values:
                      - '2026-01-01T00:00:00Z'
                    has_value: false
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '404':
          description: Customer property not found
        '409':
          description: Another property in the organization already uses the requested
            name.
        '422':
          description: Invalid request body, including attempts to set the immutable
            `type` or `type_configuration.format` fields.
        '500':
          description: Internal error
  "/v1/delete_customer_property_definition":
    post:
      summary: v1/Delete customer property definition
      description: |-
        Deletes a customer property definition.

        Responses that list property definitions no longer include the deleted definition. Required scope: `customers:rw`.
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DeleteCustomerPropertyRequest"
            examples:
              delete:
                summary: Remove a property
                value:
                  id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
      responses:
        '200':
          description: The property was deleted.
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '404':
          description: Customer property not found
        '422':
          description: Invalid request body
        '500':
          description: Internal error
  "/v1/get_customer_properties_definitions":
    post:
      summary: v1/List customer property definitions
      description: 'Returns all customer property definitions for the organization.
        Required scope: `customers:ro`.'
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: List of customer properties in the organization.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCustomerPropertiesResponse"
              example:
                last_updated_at: '2026-01-15T09:30:00Z'
                last_updated_by: 3ac8f2b1-1f6c-4a2b-8d0e-9b6f1f6c8a2b
                properties:
                - id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                  name: lifetime_value
                  type: number
                  type_configuration: {}
                  description: Lifetime spend in USD
                  has_value: true
                - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                  name: signed_up_at
                  type: timestamp
                  type_configuration:
                    format: date-time
                  has_value: false
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '422':
          description: Invalid request body
        '500':
          description: Internal error
  "/v1/set_customer_properties_values":
    post:
      summary: v1/Set customer properties values
      description: 'Sets one or more customer properties'' values for the specified
        customer. Required scope: `customers:rw`.'
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetCustomerPropertiesValuesRequest"
            examples:
              set_multiple_properties:
                summary: Set multiple properties values
                value:
                  customer_id: cf89fa3a-5ee9-4bdb-84ec-38824b2e2786
                  properties:
                    9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11: 42
                    a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d: hello
              clear_property:
                summary: Clear the property value
                value:
                  customer_id: cf89fa3a-5ee9-4bdb-84ec-38824b2e2786
                  properties:
                    9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11: 
      responses:
        '200':
          description: Properties have been set successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmptyResponse"
              example: {}
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '422':
          description: Invalid request body (e.g. missing or empty `customer_id`,
            empty `properties` map, more than 100 entries, unknown property ID, or
            a value that does not match the property type).
        '500':
          description: Internal error
  "/v1/update_customer":
    post:
      summary: v1/Update customer
      description: 'Updates the relationship level for the specified customer. Required
        scope: `customers:rw`.'
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateCustomerRequest"
            examples:
              assign_vip:
                summary: Assign VIP
                value:
                  customer_id: cf89fa3a-5ee9-4bdb-84ec-38824b2e2786
                  relationship_level: vip
              remove_relationship_level:
                summary: Remove the relationship level
                value:
                  customer_id: cf89fa3a-5ee9-4bdb-84ec-38824b2e2786
                  relationship_level: 
      responses:
        '200':
          description: Customer has been updated successfully.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmptyResponse"
              example: {}
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '404':
          description: Customer not found
        '422':
          description: Invalid request body, missing `customer_id` or `relationship_level`,
            or unsupported relationship level.
        '500':
          description: Internal error
  "/v1/create_customers":
    post:
      summary: v1/Create customers
      description: |-
        Creates up to 100 customers in one request. Each item creates a new customer. The method does not match items to existing customers. Required scope: `customers:rw`.

        If any item is invalid, the request fails and no customer is created. Otherwise, the response contains one result for each item, in the request order.

        Customers that share an email address are merged.
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateCustomersRequest"
            examples:
              create_customers:
                summary: Create two customers
                value:
                  updated_at: '2026-09-01T10:00:00Z'
                  customers:
                  - name: Jan Kowalski
                    email: jan@example.com
                    phone_number: "+48600100200"
                    address:
                      city: Wroclaw
                      country: Poland
                    relationship_level: vip
                    properties:
                      9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11: 42
                  - name: Anna Nowak
                    omnichannel:
                      whatsapp:
                        id: '48600300400'
                        name: Anna
                        phone_number: "+48600300400"
      responses:
        '200':
          description: The request passed validation. Each result shows the outcome
            for the item at the same position in the request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateCustomersResponse"
              example:
                results:
                - customer_id: cf89fa3a-5ee9-4bdb-84ec-38824b2e2786
                - error:
                    type: internal
                    message: failed to create customer
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '422':
          description: Invalid request body (e.g. an unknown field, no customers or
            more than 100 customers, `updated_at` in the future, an item without `email`,
            `phone_number`, or `omnichannel`, an invalid email address or phone number,
            an unknown or archived property ID, or a property value that does not
            match the property type). The error message identifies the item, for example
            `customers[3].email`.
        '500':
          description: Internal error
  "/v1/has_sales_events":
    post:
      summary: v1/Has sales events
      description: 'Returns whether the organization has recorded any sales activity.
        Required scope: `customers:ro`.'
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                store_uuid:
                  type: string
                  format: uuid
                  description: The store UUID to check. If omitted, the API checks
                    the entire organization.
      responses:
        '200':
          description: Whether the organization (or store) has any sales events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_sales_events:
                    type: boolean
                    description: If `true`, the organization or specified store has
                      sales activity.
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '422':
          description: Invalid request body (e.g. malformed `store_uuid`).
        '500':
          description: Internal error
  "/v1/get_segment_definitions":
    post:
      summary: v1/Get segment definitions
      description: 'Returns every active segment definition for the organization.
        Required scope: `customers:ro`.'
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: List of segment definitions in the organization.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSegmentDefinitionsResponse"
              example:
                segment_definitions:
                - segment_id: 0
                  segment_type: lead
                  definition:
                    type: or
                    nodes:
                    - type: email_set
                    - type: phone_number_set
                  last_updated_at: 
                  agent_account_id: 
                  agent_client_id: 
                - segment_id: 1
                  segment_type: qualified_lead
                  definition:
                    type: and
                    nodes:
                    - type: or
                      nodes:
                      - type: email_set
                      - type: phone_number_set
                    - type: name_set
                  last_updated_at: '2026-08-08T10:14:00Z'
                  agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
                  agent_client_id: 71d32c598862b01b9e2298281339dbc2
                - segment_id: 2
                  segment_type: custom
                  definition:
                    type: and
                    nodes:
                    - type: name_set
                    - type: customer_property_set
                      customer_property_id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                  referenced_customer_properties_definitions_ids:
                  - 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                  last_updated_at: '2026-08-08T10:15:00Z'
                  agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
                  agent_client_id: 71d32c598862b01b9e2298281339dbc2
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '422':
          description: Invalid request body
        '500':
          description: Internal error
  "/v1/create_segment_definition":
    post:
      summary: v1/Create segment definition
      description: 'Creates a custom segment definition, creates the qualified lead
        definition, or restores a deleted lead or qualified lead definition. Required
        scope: `customers:rw`.'
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSegmentDefinitionRequest"
            examples:
              name_and_property:
                summary: Named customers with a set customer property
                value:
                  definition:
                    type: and
                    nodes:
                    - type: name_set
                    - type: customer_property_set
                      customer_property_id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
              recently_active_lead:
                summary: Leads active within the last 30 days
                value:
                  definition:
                    type: and
                    nodes:
                    - type: last_active_days_ago
                      days: 30
                    - type: or
                      nodes:
                      - type: email_set
                      - type: phone_number_set
              create_qualified_lead:
                summary: Create the qualified lead definition, which a new organization
                  does not have
                value:
                  segment_type: qualified_lead
                  definition:
                    type: and
                    nodes:
                    - type: name_set
                    - type: or
                      nodes:
                      - type: email_set
                      - type: phone_number_set
              restore_lead:
                summary: Restore the lead definition after a delete, the only thing
                  this call can do at `0`
                value:
                  segment_type: lead
                  definition:
                    type: or
                    nodes:
                    - type: email_set
                    - type: phone_number_set
      responses:
        '200':
          description: The created segment definition.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SegmentDefinition"
              examples:
                name_and_property:
                  summary: Named customers with a set customer property
                  value:
                    segment_id: 2
                    segment_type: custom
                    definition:
                      type: and
                      nodes:
                      - type: name_set
                      - type: customer_property_set
                        customer_property_id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                    referenced_customer_properties_definitions_ids:
                    - 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                    last_updated_at: '2026-08-08T10:15:00Z'
                    agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
                    agent_client_id: 71d32c598862b01b9e2298281339dbc2
                recently_active_lead:
                  summary: Leads active within the last 30 days (no referenced customer
                    properties)
                  value:
                    segment_id: 3
                    segment_type: custom
                    definition:
                      type: and
                      nodes:
                      - type: last_active_days_ago
                        days: 30
                      - type: or
                        nodes:
                        - type: email_set
                        - type: phone_number_set
                    last_updated_at: '2026-08-08T10:16:00Z'
                    agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
                    agent_client_id: 71d32c598862b01b9e2298281339dbc2
                create_qualified_lead:
                  summary: The qualified lead definition, created at its fixed ID
                    with the supplied tree
                  value:
                    segment_id: 1
                    segment_type: qualified_lead
                    definition:
                      type: and
                      nodes:
                      - type: name_set
                      - type: or
                        nodes:
                        - type: email_set
                        - type: phone_number_set
                    last_updated_at: '2026-08-08T10:17:00Z'
                    agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
                    agent_client_id: 71d32c598862b01b9e2298281339dbc2
                restore_lead:
                  summary: The lead definition, restored at its fixed ID with the
                    supplied tree
                  value:
                    segment_id: 0
                    segment_type: lead
                    definition:
                      type: or
                      nodes:
                      - type: email_set
                      - type: phone_number_set
                    last_updated_at: '2026-08-08T10:18:00Z'
                    agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
                    agent_client_id: 71d32c598862b01b9e2298281339dbc2
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '422':
          description: Invalid request body (including a supplied `segment_id`, a
            `segment_type` outside the allowed values, an oversized or malformed tree,
            or a `customer_property_set` node that references a property that does
            not exist or is archived), the definition specified by `segment_type`
            is active, or the organization's limit of 8 custom definitions has been
            reached.
        '500':
          description: Internal error
  "/v1/update_segment_definition":
    post:
      summary: v1/Update segment definition
      description: 'Replaces the complete tree of a segment definition. Required scope:
        `customers:rw`.'
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateSegmentDefinitionRequest"
            examples:
              update_builtin_lead:
                summary: Update the lead definition's tree with an activity window
                value:
                  segment_id: 0
                  definition:
                    type: and
                    nodes:
                    - type: last_active_days_ago
                      days: 14
                    - type: or
                      nodes:
                      - type: email_set
                      - type: phone_number_set
              update_qualified_lead:
                summary: Replace the qualified lead definition's tree with a stricter
                  one
                value:
                  segment_id: 1
                  definition:
                    type: and
                    nodes:
                    - type: or
                      nodes:
                      - type: email_set
                      - type: phone_number_set
                    - type: name_set
                    - type: customer_property_set
                      customer_property_id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
              update_custom_definition:
                summary: Replace a custom definition's tree
                value:
                  segment_id: 2
                  definition:
                    type: name_set
      responses:
        '200':
          description: The updated segment definition.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SegmentDefinition"
              examples:
                update_builtin_lead:
                  summary: The lead definition with its replaced tree
                  value:
                    segment_id: 0
                    segment_type: lead
                    definition:
                      type: and
                      nodes:
                      - type: last_active_days_ago
                        days: 14
                      - type: or
                        nodes:
                        - type: email_set
                        - type: phone_number_set
                    last_updated_at: '2026-08-08T10:20:00Z'
                    agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
                    agent_client_id: 71d32c598862b01b9e2298281339dbc2
                update_qualified_lead:
                  summary: The qualified lead definition with its replaced tree
                  value:
                    segment_id: 1
                    segment_type: qualified_lead
                    definition:
                      type: and
                      nodes:
                      - type: or
                        nodes:
                        - type: email_set
                        - type: phone_number_set
                      - type: name_set
                      - type: customer_property_set
                        customer_property_id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                    referenced_customer_properties_definitions_ids:
                    - 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                    last_updated_at: '2026-08-08T10:25:00Z'
                    agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
                    agent_client_id: 71d32c598862b01b9e2298281339dbc2
                update_custom_definition:
                  summary: The custom definition with its replaced tree
                  value:
                    segment_id: 2
                    segment_type: custom
                    definition:
                      type: name_set
                    last_updated_at: '2026-08-08T10:30:00Z'
                    agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
                    agent_client_id: 71d32c598862b01b9e2298281339dbc2
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '404':
          description: The segment definition was not found. This occurs for an unknown
            or deleted custom ID, a deleted lead definition with ID `0`, or a qualified
            lead definition with ID `1` that the organization has not created or has
            deleted.
        '422':
          description: Invalid request body (including a missing `segment_id`, a supplied
            `segment_type`, an oversized or malformed tree, or a `customer_property_set`
            node referencing a property that does not exist or is archived).
        '500':
          description: Internal error
  "/v1/delete_segment_definition":
    post:
      summary: v1/Delete segment definition
      description: |-
        Soft-deletes a custom, lead, or qualified lead segment definition.

        The deleted definition stops being evaluated and is absent from `get_segment_definitions`, which can leave the organization with no definitions. Customer memberships associated with the definition are preserved. The service does not reuse a custom ID. Use `create_segment_definition` to restore a deleted lead or qualified lead definition. Required scope: `customers:rw`.
      parameters:
      - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DeleteSegmentDefinitionRequest"
            examples:
              delete:
                summary: Delete a custom definition
                value:
                  segment_id: 2
              delete_builtin:
                summary: Delete the lead definition, present on every organization
                value:
                  segment_id: 0
      responses:
        '200':
          description: The definition was deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
              example: {}
        '401':
          description: Invalid access token
        '403':
          description: Insufficient scopes
        '404':
          description: The segment definition was not found. This occurs for an unknown
            or deleted custom ID, a deleted lead definition with ID `0`, or a qualified
            lead definition with ID `1` that the organization has not created or has
            deleted.
        '422':
          description: Invalid request body (e.g. a missing `segment_id`).
        '500':
          description: Internal error
components:
  parameters:
    AuthHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: A valid access token, either an OAuth2 Token (Bearer) or a Personal
        Access Token (Basic).
  schemas:
    EmptyResponse:
      type: object
      description: An empty JSON object. The call carries no data back.
      additionalProperties: false
    Customer:
      type: object
      required:
      - customer_id
      - organization_id
      - product
      - cluster_id
      - is_master
      - monitoring
      - custom_fields
      - statistics
      properties:
        customer_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        product:
          type: string
          example: livechat
        cluster_id:
          type: string
          format: uuid
          description: |-
            The ID that groups the customer identities of one person. It is the merged customer ID when the identity has been merged, and `customer_id` otherwise.

            Merging and unmerging change the value, so do not use it as a durable person identifier.
        is_master:
          type: boolean
          description: If `true`, the object holds the data of a merged customer.
            `/get_merged_customer` returns the merged customer under the requested
            identity ID.
        child_sources:
          type: array
          items:
            type: string
            enum:
            - monitoring
            - helpdesk
            - api
          description: |-
            The sources of the customer identity's activity. An empty array means that the identity has no visits, chats, or tickets, and was not created with `/v1/create_customers`. Omitted when `is_master` is `true`.

            - `monitoring` — The identity has a website visit or a chat.
            - `helpdesk` — The identity has a HelpDesk ticket.
            - `api` — The identity was created with `/v1/create_customers`.
        monitoring:
          oneOf:
          - "$ref": "#/components/schemas/Monitoring"
          - type: 'null'
          description: The customer's profile and website activity collected by Text.
        custom_fields:
          oneOf:
          - "$ref": "#/components/schemas/CustomFields"
          - type: 'null'
          description: The object groups custom fields about the customer by the client
            ID of the app that set their values. You can retrieve but not modify these
            fields with the Customer Data Platform API. Unlike `customer_properties`,
            `custom_fields` do not have predefined types and cannot be used to filter
            customers.
        statistics:
          oneOf:
          - "$ref": "#/components/schemas/Statistics"
          - type: 'null'
        chat:
          "$ref": "#/components/schemas/Chat"
        invitation:
          "$ref": "#/components/schemas/Invitation"
        customer_properties:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/CustomerPropertyValue"
          description: |-
            A map of customer property definition IDs to their current values. You can use these properties to filter customers. The field is omitted when the customer has no property values.

            In Text interfaces, customer properties are labeled customer fields.
        tickets:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/Ticket"
          description: A map of ticket IDs to the customer's HelpDesk tickets. The
            map holds at most 1000 tickets per customer. To get every ticket ID, use
            `/get_merged_customer_tickets`.
        omnichannel:
          "$ref": "#/components/schemas/Omnichannel"
        orders:
          type: array
          items:
            "$ref": "#/components/schemas/Order"
        carts:
          type: array
          items:
            "$ref": "#/components/schemas/Cart"
        segment_memberships:
          type: array
          items:
            "$ref": "#/components/schemas/SegmentMembership"
          description: The customer's membership state for each segment that has been
            evaluated for the customer.
        relationship_level:
          type: string
          enum:
          - vip
          nullable: true
          description: Relationship level. Omitted when no relationship level is assigned.
        opt_ins:
          type: object
          additionalProperties:
            type: array
            items:
              "$ref": "#/components/schemas/OptIn"
          description: Marketing consents the customer has granted, keyed by channel
            (`sms`, `whatsapp`, `messenger`, `instagram`). Only consents valid at
            the time of the request are returned; a channel left with none is omitted,
            as is the whole field when the customer has no consents.
    OptIn:
      type: object
      required:
      - asset_id
      properties:
        asset_id:
          type: string
          description: The address the consent covers - a phone number in E.164 for
            telephony channels, a handle for the others.
          example: "+48555111222"
        valid_until:
          type: string
          format: date-time
          description: When the consent expires. Omitted when it does not expire.
          example: '2026-09-01T00:00:00Z'
    Monitoring:
      type: object
      required:
      - name
      - name_is_default
      - email
      - suggested_email
      - avatar_url
      - phone_number
      - session_fields
      - visits
      - state
      - online
      - current_group_ids
      - created_at
      - master_id
      properties:
        name:
          type: string
        name_is_default:
          type: boolean
          description: If `true`, the customer’s name is a placeholder set by Text
            according to the license’s language settings, including custom translations.
        email:
          type: string
        suggested_email:
          type: string
          description: The email address suggested for the customer based on tracked
            activity, such as a form submission. The customer has not confirmed this
            address.
        avatar_url:
          type: string
        phone_number:
          type: string
        session_fields:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
          description: Custom key-value pairs set for the customer's current or most
            recent session. These correspond to `session_fields` in the [Agent Chat
            API](https://platform.text.com/docs/messaging/agent-chat-api/data-structures#customer)
            and [Customer Chat API](https://platform.text.com/docs/messaging/customer-chat-api/data-structures#customer).
        visits:
          type: array
          items:
            "$ref": "#/components/schemas/Visit"
        state:
          "$ref": "#/components/schemas/MonitoringState"
        online:
          type: boolean
          description: If `true`, the customer's most recent visit is still active.
        current_group_ids:
          type: array
          items:
            type: integer
          description: The IDs of the groups available to handle the customer in their
            current or most recent browsing context.
        created_at:
          type: string
          format: date-time
          description: The date and time when the customer identity was created.
        master_id:
          description: The ID of the merged customer that includes this customer identity.
            The value is empty when the identity has not been merged.
          oneOf:
          - type: string
            format: uuid
            minLength: 1
          - type: string
            enum:
            - ''
        address:
          "$ref": "#/components/schemas/Address"
      description: The customer's profile and website activity collected by Text.
    Address:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        country:
          type: string
        state:
          type: string
        postal_code:
          type: string
    MonitoringState:
      type: string
      enum:
      - ''
      - browsing
      - queued
      - invited
      - chatting
      - chat closed
      - offline
    Visit:
      type: object
      required:
      - id
      - started_at
      - geolocation
      properties:
        id:
          type: integer
        started_at:
          type: string
        ended_at:
          type: string
        geolocation:
          "$ref": "#/components/schemas/Geolocation"
        ip:
          type: string
        user_agent:
          type: string
        page_referrer:
          type: string
        first_visited_page:
          "$ref": "#/components/schemas/Page"
        pages:
          type: array
          items:
            "$ref": "#/components/schemas/Page"
    Page:
      type: object
      required:
      - id
      - started_at
      - url
      - title
      - group_ids
      properties:
        id:
          type: integer
        started_at:
          type: string
        url:
          type: string
        title:
          type: string
        group_ids:
          type: array
          items:
            type: integer
    Geolocation:
      type: object
      required:
      - latitude
      - longitude
      - country
      - country_code
      - region
      - city
      - timezone
      properties:
        latitude:
          type: string
        longitude:
          type: string
        country:
          type: string
        country_code:
          type: string
        region:
          type: string
        city:
          type: string
        timezone:
          type: string
    CustomFields:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: string
      description: The object groups custom fields about the customer by the client
        ID of the app that set their values.
    Statistics:
      type: object
      required:
      - chats_count
      - threads_count
      - visits_count
      - page_views_count
      - greetings_accepted_count
      - greetings_converted_count
      - tickets_count
      - tickets_inbox_count
      - tickets_archive_count
      - tickets_spam_count
      - tickets_trash_count
      - orders_count
      properties:
        chats_count:
          type: integer
        threads_count:
          type: integer
        visits_count:
          type: integer
        page_views_count:
          type: integer
        greetings_accepted_count:
          type: integer
        greetings_converted_count:
          type: integer
        tickets_count:
          type: integer
        tickets_inbox_count:
          type: integer
        tickets_archive_count:
          type: integer
        tickets_spam_count:
          type: integer
        tickets_trash_count:
          type: integer
        orders_count:
          type: integer
        last_activity_at:
          type: string
          format: date-time
          description: The date and time of the customer's most recent recorded activity
            across visits, tickets, chats, omnichannel chats, and campaign interactions.
        last_visit_at:
          type: string
          format: date-time
        last_ticket_created_at:
          type: string
          format: date-time
        last_ticket_customer_message_at:
          type: string
          format: date-time
        last_chat_at:
          type: string
          format: date-time
        last_omnichannel_chat_at:
          type: string
          format: date-time
        last_campaign_interaction_at:
          type: string
          format: date-time
    Chat:
      type: object
      required:
      - active
      - chat_id
      - thread_id
      - last_updated_at
      - group_ids
      properties:
        active:
          type: boolean
        chat_id:
          type: string
        thread_id:
          format: string
        last_updated_at:
          type: string
          format: date-time
        group_ids:
          type: array
          items:
            type: integer
        source_customer_client_id:
          type: string
          description: The `client_id` associated with the customer's original chat
            channel, such as the Chat Widget, Facebook Messenger, or WhatsApp. The
            value remains unchanged throughout the thread. See [`customer_client_id`](https://platform.text.com/docs/messaging/references/default-properties#customer_client_id).
    Invitation:
      type: object
      required:
      - active
      - greeting_id
      - greeting_unique_id
      - greeting_name
      properties:
        active:
          type: boolean
        greeting_id:
          type: integer
        greeting_unique_id:
          format: uuid
        greeting_name:
          type: string
    Ticket:
      type: object
      required:
      - ticket_id
      - hd_license_id
      - status
      - created_at
      - last_updated_at
      properties:
        ticket_id:
          type: string
          format: uuid
        hd_license_id:
          type: string
        status:
          type: string
        silo:
          "$ref": "#/components/schemas/TicketSilo"
        created_at:
          type: string
          format: date-time
        last_updated_at:
          type: string
          format: date-time
        last_customer_message_at:
          type: string
          format: date-time
    TicketSilo:
      type: string
      enum:
      - inbox
      - archive
      - spam
      - trash
    Omnichannel:
      type: object
      properties:
        fbmessenger:
          type: array
          items:
            "$ref": "#/components/schemas/OmnichannelFBMessenger"
        twilio:
          type: array
          items:
            "$ref": "#/components/schemas/OmnichannelTwilio"
        whatsapp:
          type: array
          items:
            "$ref": "#/components/schemas/OmnichannelWhatsApp"
        instagram:
          type: array
          items:
            "$ref": "#/components/schemas/OmnichannelInstagram"
        telegram:
          type: array
          items:
            "$ref": "#/components/schemas/OmnichannelTelegram"
        sms:
          type: array
          items:
            "$ref": "#/components/schemas/OmnichannelSms"
    OmnichannelFBMessenger:
      type: object
      required:
      - id
      - is_verified_user
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        profile_pic:
          type: string
          format: url
        gender:
          type: string
        locale:
          type: string
        is_verified_user:
          type: boolean
    OmnichannelTwilio:
      type: object
      required:
      - phone_number
      properties:
        phone_number:
          type: string
    OmnichannelWhatsApp:
      type: object
      required:
      - id
      - phone_number
      properties:
        id:
          type: string
        name:
          type: string
        phone_number:
          type: string
    OmnichannelInstagram:
      type: object
      required:
      - ig_user_id
      properties:
        ig_user_id:
          type: string
        username:
          type: string
        name:
          type: string
        profile_pic:
          type: string
          format: url
        follower_count:
          type: integer
          format: int64
        is_verified_user:
          type: boolean
        is_user_follow_business:
          type: boolean
        is_business_follow_user:
          type: boolean
    OmnichannelTelegram:
      type: object
      required:
      - telegram_user_id
      properties:
        telegram_user_id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        language_code:
          type: string
        display_name:
          type: string
        is_premium:
          type: boolean
          nullable: true
    OmnichannelSms:
      type: object
      required:
      - phone_number
      properties:
        phone_number:
          type: string
    Order:
      type: object
      required:
      - customer_id
      - store_platform
      - store_uuid
      - order_id
      - order_number
      - currency
      - total_price
      - created_at
      - event_id
      - event_client_id
      properties:
        customer_id:
          type: string
          format: uuid
          description: The ID of the customer who created the order.
        store_platform:
          type: string
          description: The platform that hosts the store.
        store_uuid:
          type: string
          format: uuid
          description: The store's unique identifier in Text.
        order_id:
          type: string
          description: The order ID provided by the store platform.
        order_number:
          type: string
          description: The human-readable order number shown to agents.
        currency:
          type: string
          description: The order currency as an ISO 4217 code.
        total_price:
          type: number
          format: double
          description: The total price of the order.
        created_at:
          type: string
          format: date-time
          description: The date and time when the order was created.
        event_id:
          type: string
          format: uuid
          description: The ID that Text assigns to the sales event that created the
            order.
        event_client_id:
          type: string
          description: The client ID of the app that reported the sales event.
        line_items:
          type: array
          items:
            "$ref": "#/components/schemas/OrderLineItem"
          description: The order's line items.
        source:
          type: string
          description: The source of the order, as reported by the app.
      description: An order created by the customer in an organization's store. See
        the [`store_order_was_created` system activity](https://platform.text.com/docs/messaging/references/system-activities#store_order_was_created)
        for the event that supplies order data.
    Cart:
      type: object
      required:
      - store_uuid
      - store_platform
      - customer_signed_in
      - subtotal
      - total
      - subtotal_usd
      - total_usd
      - currency
      - items
      - last_updated_at
      properties:
        store_uuid:
          type: string
          format: uuid
          description: The store's unique identifier in Text.
        store_platform:
          type: string
          description: The platform that hosts the store.
        customer_signed_in:
          type: boolean
          description: If `true`, the customer is signed in to the store associated
            with the cart.
        subtotal:
          type: number
          format: double
          description: The cart total before discounts.
        total:
          type: number
          format: double
          description: The cart total after discounts.
        subtotal_usd:
          type: number
          format: double
          description: The cart subtotal expressed in US dollars.
        total_usd:
          type: number
          format: double
          description: The cart total expressed in US dollars.
        currency:
          type: string
          description: The cart currency as an ISO 4217 code.
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CartItem"
          description: The line items in the customer's cart.
        last_updated_at:
          type: string
          format: date-time
          description: The date and time when the cart was last updated.
      description: The customer's shopping cart. See [Set customer cart](https://platform.text.com/docs/extending-chat-widget/javascript-api#set-customer-cart)
        for information about reporting cart data from a store.
    CartItem:
      type: object
      required:
      - id
      - quantity
      - variant_id
      properties:
        id:
          type: integer
          format: int64
          description: The cart item ID provided by the store platform.
        quantity:
          type: integer
          description: The quantity of the cart item.
        variant_id:
          type: integer
          format: int64
          description: The product variant ID provided by the store platform.
        discounts:
          type: array
          items:
            type: string
          description: The discounts applied to the cart item.
    OrderLineItem:
      type: object
      required:
      - title
      - quantity
      - price
      properties:
        title:
          type: string
          description: The product name shown to agents.
        quantity:
          type: integer
          description: The quantity ordered.
        price:
          type: number
          format: double
          description: The unit price of the line item.
        sku:
          type: string
          description: The stock-keeping unit (SKU) provided by the store platform.
        variant_id:
          type: string
          description: The product variant ID provided by the store platform.
        product_id:
          type: string
          description: The product ID provided by the store platform.
    SegmentMembership:
      type: object
      required:
      - segment_id
      - is_member
      properties:
        segment_id:
          type: integer
          format: int64
          description: ID of the segment definition this membership refers to. There
            is one built-in segment with the ID 0 (lead).
          example: 0
        is_member:
          type: boolean
          description: If `true`, the customer satisfies the segment's conditions.
          example: true
        membership_last_updated_at:
          type: string
          format: date-time
          description: The date and time when `is_member` last changed because the
            customer was added to or removed from the segment.
          example: '2026-07-13T13:11:21.187676Z'
        membership_attribution:
          type: array
          items:
            type: string
          description: The account IDs of agents whose changes caused the customer
            to join the segment. The array is empty when the membership is not attributed
            to an agent.
          example:
          - bc35115a-6f12-40b4-bbb0-8187b0f68c8e
        conditions_provenance:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/ConditionProvenance"
          description: A map of the conditions the customer currently satisfies. Each
            key is a condition name, for example, `email_set` or `phone_number_set`.
          example:
            email_set:
              last_updated_at: '2026-07-15T09:31:45.075731Z'
              agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
              agent_client_id: 71d32c598862b01b9e2298281339dbc2
    ConditionProvenance:
      type: object
      required:
      - last_updated_at
      properties:
        last_updated_at:
          type: string
          format: date-time
          description: The date and time when the customer field or property evaluated
            by the condition was last updated.
          example: '2026-07-13T13:11:21.187676Z'
        agent_account_id:
          type: string
          description: The account ID of the agent who updated the customer field
            or property. The field is omitted when the update is not attributed to
            an agent.
          example: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
        agent_client_id:
          type: string
          description: The client ID identifies the API client associated with the
            access token used for the update. Updates made through the Text app also
            include this value. The field is omitted when no client ID was recorded
            for the update.
          example: 71d32c598862b01b9e2298281339dbc2
    CustomerPropertyValue:
      type: object
      required:
      - value
      - last_updated_at
      properties:
        value:
          description: The property value. Its JSON type and format depend on the
            property definition. A `null` value indicates that the property has been
            cleared.
          nullable: true
        last_updated_at:
          type: string
          format: date-time
          description: The date and time when this property value was last updated.
        last_updated_agent_account_id:
          type: string
          description: The account ID of the agent who last set this value. Omitted
            when an agent did not set the value.
        last_updated_agent_client_id:
          type: string
          description: The client ID of the app that last set this value. Omitted
            when an agent did not set the value.
    CustomerPropertyType:
      type: string
      enum:
      - bool
      - string
      - number
      - timestamp
      - link
      - text
      description: The customer property value type. You cannot change `type` after
        creating the property. A `text` value can contain up to 5,000 characters.
        Properties of type `text` do not support `allowed_values`.
    CustomerPropertyTypeConfiguration:
      type: object
      description: The configuration for a customer property type. Only `timestamp`
        properties support `format`. Properties of type `text` do not support `allowed_values`.
      example: {}
      properties:
        format:
          type: string
          enum:
          - date-time
          - date
          - time
          description: The format used for timestamp property values. If omitted,
            values must use the RFC 3339 date-time format. This field is present only
            for `timestamp` properties and cannot be changed after creation.
        allowed_values:
          type: array
          maxItems: 30
          items: {}
          description: |-
            The optional set of accepted values that match the property `type`. The API stores each value as provided and matches assigned values against the set exactly.

            The API rejects values outside this set with `422`, but always accepts `null` to clear the property. The property remains single-valued; the set defines allowed values rather than a multi-value type. When creating the property, provide the complete set. The API rejects exact duplicates and empty or `null` entries.

            Changing the set does not modify stored customer values, which the API continues to return even if they no longer match.
    CustomerPropertyTypeConfigurationUpdate:
      type: object
      additionalProperties: false
      description: The changes to the property's allowed values. You cannot change
        the `format` after creating the property. The `allowed_values` field is not
        supported for `text` properties.
      example: {}
      properties:
        allowed_values:
          type: array
          maxItems: 30
          items:
            description: A single accepted value that matches the property `type`.
          description: The allowed values that replace the configured values. Send
            an empty array to remove all value restrictions. Each value must match
            the property type.
    CustomerProperty:
      type: object
      required:
      - id
      - name
      - type
      - type_configuration
      - has_value
      example:
        id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
        name: lifetime_value
        type: number
        type_configuration: {}
        description: Lifetime spend in USD
        has_value: true
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier generated when the property is created.
        name:
          type: string
          maxLength: 128
          description: A human-readable property name. It must be unique within the
            organization. The property name is also displayed in the Text app.
        type:
          "$ref": "#/components/schemas/CustomerPropertyType"
        type_configuration:
          "$ref": "#/components/schemas/CustomerPropertyTypeConfiguration"
        description:
          type: string
          maxLength: 512
        has_value:
          type: boolean
          description: If `true`, at least one customer has a value set for this property.
    CreateCustomerPropertyRequest:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
          maxLength: 128
          description: The property name. It cannot be empty and must be unique within
            the organization.
        type:
          "$ref": "#/components/schemas/CustomerPropertyType"
        type_configuration:
          "$ref": "#/components/schemas/CustomerPropertyTypeConfiguration"
        description:
          type: string
          maxLength: 512
    UpdateCustomerPropertyRequest:
      type: object
      required:
      - id
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the property to update.
        name:
          type: string
          maxLength: 128
          description: The updated property name. It must be unique within the organization.
        description:
          type: string
          maxLength: 512
        type_configuration:
          "$ref": "#/components/schemas/CustomerPropertyTypeConfigurationUpdate"
      description: At least one of `name`, `description`, `type_configuration` must
        be provided. The `type` field is intentionally absent — type is immutable,
        and any unknown field (including `type`) causes the request to be rejected
        with a validation error. Within `type_configuration`, only `allowed_values`
        can be updated; timestamp `format` is immutable after property creation.
    DeleteCustomerPropertyRequest:
      type: object
      required:
      - id
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the property to delete.
    ListCustomerPropertiesResponse:
      type: object
      required:
      - properties
      properties:
        last_updated_at:
          type: string
          format: date-time
          description: The date and time of the most recent change to any customer
            property definition in the organization.
        last_updated_by:
          type: string
          description: The account ID of the agent who made the most recent change
            to any customer property definition in the organization.
        properties:
          type: array
          items:
            "$ref": "#/components/schemas/CustomerProperty"
    SetCustomerPropertiesValuesRequest:
      type: object
      required:
      - customer_id
      - properties
      additionalProperties: false
      properties:
        customer_id:
          type: string
          description: The customer ID.
        properties:
          type: object
          additionalProperties:
            description: 'A property value keyed by property definition ID. The API
              validates the value against the property''s type and type configuration.
              The value type must match the property''s defined type: boolean for
              `bool`, string of up to 2048 characters for `string`, number for `number`,
              RFC 3339, date, or time string for `timestamp` depending on its configured
              format, valid HTTP(S) URL string of up to 2048 characters for `link`,
              or string of up to 5000 characters for `text`. Use `null` to clear a
              property value.'
          description: A map of property definition IDs to their values.
      description: The customer property values to set. Unknown fields return a validation
        error.
    UpdateCustomerRequest:
      type: object
      required:
      - customer_id
      - relationship_level
      additionalProperties: false
      properties:
        customer_id:
          type: string
          format: uuid
          description: The customer to update.
        relationship_level:
          type: string
          enum:
          - vip
          nullable: true
          description: Assign `vip` or use `null` to remove the relationship level.
    CreateCustomersRequest:
      type: object
      required:
      - customers
      additionalProperties: false
      properties:
        updated_at:
          type: string
          format: date-time
          description: The date and time of the last update of the data in the source
            system. It must not be in the future. Imported data does not replace newer
            data of a merged customer. The default is `1970-01-01T00:00:00Z`.
        customers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            "$ref": "#/components/schemas/CreateCustomerItem"
          description: The customers to create.
      description: The customers to create. Unknown fields return a validation error.
    CreateCustomerItem:
      type: object
      additionalProperties: false
      description: A customer to create. Each item requires at least one of `email`,
        `phone_number`, or `omnichannel`.
      properties:
        name:
          type: string
          maxLength: 255
          description: The customer's name.
        email:
          type: string
          format: email
          maxLength: 255
          description: The customer's email address.
        phone_number:
          type: string
          description: The customer's phone number in E.164 format, for example `+48600100200`.
            The number must be valid for its country code.
        address:
          "$ref": "#/components/schemas/CreateCustomerAddress"
        relationship_level:
          type: string
          enum:
          - vip
          nullable: true
          description: The customer's relationship level. `null` or omitted means
            no relationship level.
        properties:
          type: object
          maxProperties: 100
          additionalProperties:
            description: A property value keyed by property definition ID. The value
              must match the property's type, as in [`/v1/set_customer_properties_values`](#/paths/~1v1~1set_customer_properties_values/post).
              A `null` value is ignored.
          description: A map of property definition IDs to their values. Archived
            properties are not accepted.
        omnichannel:
          "$ref": "#/components/schemas/CreateCustomerOmnichannel"
    CreateCustomerAddress:
      type: object
      additionalProperties: false
      description: The customer's address. An address with only empty fields is ignored.
      properties:
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 255
        country:
          type: string
          maxLength: 255
        state:
          type: string
          maxLength: 255
        postal_code:
          type: string
          maxLength: 255
    CreateCustomerOmnichannel:
      type: object
      additionalProperties: false
      description: The customer's identities in messaging channels, in the same format
        as `omnichannel` in the Agent Chat API v3.7 `update_customer` method. Each
        channel takes one object. Any set channel counts as contact data.
      properties:
        fbmessenger:
          type: object
          required:
          - id
          properties:
            id:
              type: string
              maxLength: 512
            name:
              type: string
              maxLength: 512
            first_name:
              type: string
              maxLength: 256
            last_name:
              type: string
              maxLength: 256
            profile_pic:
              type: string
              format: url
              maxLength: 1024
              description: An HTTPS URL of the profile picture.
            gender:
              type: string
              maxLength: 128
            locale:
              type: string
              maxLength: 128
              description: An IETF BCP 47 language tag.
            is_verified_user:
              type: boolean
        twilio:
          type: object
          required:
          - phone_number
          properties:
            phone_number:
              type: string
              description: A phone number in E.164 format.
        whatsapp:
          type: object
          required:
          - id
          - phone_number
          properties:
            id:
              type: string
              maxLength: 512
            name:
              type: string
              maxLength: 512
            phone_number:
              type: string
              description: A phone number in E.164 format.
        instagram:
          type: object
          required:
          - ig_user_id
          properties:
            ig_user_id:
              type: string
              maxLength: 512
            username:
              type: string
              maxLength: 512
            name:
              type: string
              maxLength: 512
            profile_pic:
              type: string
              format: url
              maxLength: 2048
              description: An HTTPS URL of the profile picture.
            follower_count:
              type: integer
              format: int64
              minimum: 0
            is_verified_user:
              type: boolean
            is_user_follow_business:
              type: boolean
            is_business_follow_user:
              type: boolean
        telegram:
          type: object
          required:
          - telegram_user_id
          properties:
            telegram_user_id:
              type: integer
              format: int64
            first_name:
              type: string
              maxLength: 256
            last_name:
              type: string
              maxLength: 256
            username:
              type: string
              maxLength: 512
            language_code:
              type: string
              maxLength: 128
            display_name:
              type: string
              maxLength: 512
            is_premium:
              type: boolean
        sms:
          type: object
          required:
          - phone_number
          properties:
            phone_number:
              type: string
              description: A phone number in E.164 format.
    CreateCustomersResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              customer_id:
                type: string
                format: uuid
                description: The ID of the created customer. Omitted when the item
                  failed.
              error:
                type: object
                description: The error for an item that was not created. Omitted when
                  the item succeeded. You can retry a failed item.
                required:
                - type
                - message
                properties:
                  type:
                    type: string
                    example: internal
                  message:
                    type: string
          description: The results in the order of the request items.
    SegmentDefinitionNode:
      description: 'A node in a segment definition tree: one of two operators (`and`,
        `or`) or one of five conditions (`name_set`, `email_set`, `phone_number_set`,
        `customer_property_set`, `last_active_days_ago`). Every node type rejects
        unknown fields, including fields that are valid on a different node type.'
      oneOf:
      - "$ref": "#/components/schemas/AndSegmentNode"
      - "$ref": "#/components/schemas/OrSegmentNode"
      - "$ref": "#/components/schemas/NameSetSegmentNode"
      - "$ref": "#/components/schemas/EmailSetSegmentNode"
      - "$ref": "#/components/schemas/PhoneNumberSetSegmentNode"
      - "$ref": "#/components/schemas/CustomerPropertySetSegmentNode"
      - "$ref": "#/components/schemas/LastActiveDaysAgoSegmentNode"
      discriminator:
        propertyName: type
        mapping:
          and: "#/components/schemas/AndSegmentNode"
          or: "#/components/schemas/OrSegmentNode"
          name_set: "#/components/schemas/NameSetSegmentNode"
          email_set: "#/components/schemas/EmailSetSegmentNode"
          phone_number_set: "#/components/schemas/PhoneNumberSetSegmentNode"
          customer_property_set: "#/components/schemas/CustomerPropertySetSegmentNode"
          last_active_days_ago: "#/components/schemas/LastActiveDaysAgoSegmentNode"
    AndSegmentNode:
      type: object
      additionalProperties: false
      required:
      - type
      - nodes
      description: True when every child node evaluates to true.
      properties:
        type:
          type: string
          enum:
          - and
        nodes:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/SegmentDefinitionNode"
          description: Child nodes. An `and` node with no children is a validation
            error.
    OrSegmentNode:
      type: object
      additionalProperties: false
      required:
      - type
      - nodes
      description: True when at least one child node evaluates to true.
      properties:
        type:
          type: string
          enum:
          - or
        nodes:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/SegmentDefinitionNode"
          description: Child nodes. An `or` node with no children is a validation
            error.
    NameSetSegmentNode:
      type: object
      additionalProperties: false
      required:
      - type
      description: True when the customer has a non-empty name that is not a default,
        system-generated name.
      properties:
        type:
          type: string
          enum:
          - name_set
    EmailSetSegmentNode:
      type: object
      additionalProperties: false
      required:
      - type
      description: True when the customer has a non-empty email address.
      properties:
        type:
          type: string
          enum:
          - email_set
    PhoneNumberSetSegmentNode:
      type: object
      additionalProperties: false
      required:
      - type
      description: True when the customer has a non-empty phone number.
      properties:
        type:
          type: string
          enum:
          - phone_number_set
    CustomerPropertySetSegmentNode:
      type: object
      additionalProperties: false
      required:
      - type
      - customer_property_id
      description: True when the referenced customer property currently has a non-null
        value for the customer; an empty but non-null value counts as set.
      properties:
        type:
          type: string
          enum:
          - customer_property_set
        customer_property_id:
          type: string
          format: uuid
          description: ID of the referenced customer property definition. Validated
            as a UUID and checked against the organization's active property schema
            when the containing segment definition is created or updated; a stored
            definition does not become invalid retroactively if the referenced property
            is later archived or deleted.
    LastActiveDaysAgoSegmentNode:
      type: object
      additionalProperties: false
      required:
      - type
      - days
      description: True when the customer's last activity was at most `days` days
        ago.
      properties:
        type:
          type: string
          enum:
          - last_active_days_ago
        days:
          type: integer
          minimum: 1
          maximum: 365
          description: The number of days to look back for the customer's last activity.
    SegmentDefinition:
      type: object
      description: A segment definition record, as returned by `get_segment_definitions`
        and by the create/update mutations.
      required:
      - segment_id
      - segment_type
      - definition
      - last_updated_at
      - agent_account_id
      - agent_client_id
      example:
        segment_id: 2
        segment_type: custom
        definition:
          type: and
          nodes:
          - type: name_set
          - type: customer_property_set
            customer_property_id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
        referenced_customer_properties_definitions_ids:
        - 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
        last_updated_at: '2026-08-08T10:15:00Z'
        agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
        agent_client_id: 71d32c598862b01b9e2298281339dbc2
      properties:
        segment_id:
          type: integer
          format: int64
          description: The definition ID. ID `0` is reserved for the lead definition,
            which every organization has initially. ID `1` is reserved for the qualified
            lead definition, which exists only after the organization creates it.
            Custom definitions receive IDs starting at `2`.
          example: 2
        segment_type:
          type: string
          enum:
          - lead
          - qualified_lead
          - custom
          description: |-
            The segment type is fixed for the lifetime of the definition:
            - `lead` — The definition with ID `0`.
            - `qualified_lead` — The definition with ID `1`.
            - `custom` — A definition with an ID starting at `2`.
        definition:
          "$ref": "#/components/schemas/SegmentDefinitionNode"
        referenced_customer_properties_definitions_ids:
          type: array
          items:
            type: string
            format: uuid
          description: The customer property definition IDs referenced in `definition`,
            deduplicated in definition order. Omitted when the tree has no `customer_property_set`
            node. The array includes IDs for properties that were archived or deleted
            after the segment definition was saved.
        last_updated_at:
          type: string
          format: date-time
          nullable: true
          description: The date and time when the definition was most recently created
            or updated. If multiple updates are processed at the same time, their
            timestamps may not match the order in which the updates are saved. The
            value is `null` for the lead definition before its first update.
        agent_account_id:
          type: string
          nullable: true
          description: The account ID of the agent who last created or updated the
            definition. The value is `null` for the lead definition before its first
            update.
        agent_client_id:
          type: string
          nullable: true
          description: The client ID of the app that last created or updated the definition.
            The value is `null` for the lead definition before its first update.
    GetSegmentDefinitionsResponse:
      type: object
      required:
      - segment_definitions
      properties:
        segment_definitions:
          type: array
          items:
            "$ref": "#/components/schemas/SegmentDefinition"
          description: The active definitions for the organization, ordered by `segment_id`.
            Every organization starts with the lead definition at ID `0`. The qualified
            lead definition at ID `1` appears only after the organization creates
            it. Deleted definitions are absent, so the array can be empty. Restoring
            a deleted lead or qualified lead definition reuses its fixed ID but may
            apply different conditions.
    CreateSegmentDefinitionRequest:
      type: object
      required:
      - definition
      additionalProperties: false
      description: The segment definition to create. The request cannot include `segment_id`;
        supplying it returns a validation error.
      properties:
        segment_type:
          type: string
          enum:
          - lead
          - qualified_lead
          - custom
          description: |-
            The segment type. If omitted, the API creates a custom definition. Definitions with IDs `0` and `1` do not consume a custom slot. To change an active definition, use `update_segment_definition`. Values are case-sensitive.

            - `custom` — Creates a custom definition with the next available ID starting at `2`. An organization can have up to 8 active custom definitions.
            - `lead` — Restores the deleted lead definition at ID `0`. Every organization starts with this definition, so it must be deleted before it can be restored.
            - `qualified_lead` — Creates the qualified lead definition at ID `1` or restores it after deletion.
          example: qualified_lead
        definition:
          "$ref": "#/components/schemas/SegmentDefinitionNode"
    UpdateSegmentDefinitionRequest:
      type: object
      required:
      - segment_id
      - definition
      additionalProperties: false
      description: Replaces the entire tree of an existing segment definition; partial
        tree updates are not supported. `segment_type` is server-assigned and cannot
        be supplied.
      properties:
        segment_id:
          type: integer
          format: int64
          example: 0
          description: The definition ID to update. ID `0` identifies the lead definition,
            which every organization has unless it has been deleted. ID `1` identifies
            the qualified lead definition, which exists only after the organization
            creates it. The API returns `404` for a deleted definition or a qualified
            lead definition that has not been created. Use `create_segment_definition`
            to create the qualified lead definition or restore a deleted lead or qualified
            lead definition.
        definition:
          "$ref": "#/components/schemas/SegmentDefinitionNode"
    DeleteSegmentDefinitionRequest:
      type: object
      required:
      - segment_id
      additionalProperties: false
      properties:
        segment_id:
          type: integer
          format: int64
          example: 2
          description: The definition ID to delete. The lead definition at ID `0`
            exists initially and can be deleted before its first update. The qualified
            lead definition at ID `1` can be deleted only after the organization creates
            it. The API returns `404` for an unknown or deleted definition.
    Clause:
      type: object
      required:
      - operator
      properties:
        field:
          type: string
          enum:
          - name
          - email
          - suggested_email
          - phone_number
          - phone_number_country_code
          - country
          - country_code
          - relationship_level
          - segment_id
          - last_activity
          - last_visit_started
          - last_chat_at
          - last_ticket_created_at
          - last_ticket_customer_message_at
          - visits_count
          - page_views_count
          - chats_count
          - threads_count
          - greetings_accepted_count
          - greetings_converted_count
          - tickets_count
          - tickets_inbox_count
          - tickets_archive_count
          - tickets_spam_count
          - tickets_trash_count
          - orders_count
          - cart_last_updated_at
          - cart_total_usd
          - address_street
          - address_city
          - address_country
          - address_state
          - address_postal_code
          - customer_property
          description: |-
            The field to filter. For customer properties, set this field to `customer_property` and provide `property_id`. For relationship levels, use the `is` operator with `vip` as the only supported value. For segment memberships, set this field to `segment_id` and provide `values`, `entered_at`, or both. The API combines multiple segment IDs with OR logic and rejects IDs that do not belong to the organization.

            The built-in IDs `0` (lead) and `1` (qualified lead) remain valid filter values while their definitions are deleted. Deleting a definition preserves its existing memberships. If you restore it with different conditions, the filter can match memberships calculated from its earlier definition until each customer is evaluated again.
        property_id:
          type: string
          description: The customer property definition ID to filter by. Required
            when `field` is `customer_property`. The API ignores this field for built-in
            fields and rejects unknown IDs with a validation error.
          example: db34b1fe-22ce-4d41-bd0b-e15567f4c81b
        entered_at:
          type: object
          description: |-
            The inclusive date and time range when the customer joined a segment. This field applies only when `field` is `segment_id`.

            If `values` is provided, the range applies to the same segment membership. Without `values`, the range matches membership in any segment. A `segment_id` clause must include `values`, `entered_at`, or both.
          properties:
            from:
              type: string
              format: date-time
              description: The inclusive start of the join range as an RFC 3339 date
                and time.
              example: '2026-08-01T00:00:00Z'
            to:
              type: string
              format: date-time
              description: The inclusive end of the join range as an RFC 3339 date
                and time.
              example: '2026-08-06T00:00:00Z'
        operator:
          type: string
          enum:
          - contains
          - is
          - range
          - exists
          - starts_with
          description: |
            Filter operator:
            - `exists`: Check if field exists/is populated (name, email, suggested_email, phone_number, address_street, address_city, address_country, address_state, address_postal_code)
            - `contains`: Partial string matching (name, email, suggested_email, phone_number, address_street, address_city, address_country, address_state, address_postal_code)
            - `is`: Exact match for single or multiple values (all fields)
            - `range`: Range filter for dates, numbers, or cart values (statistics fields, cart fields)
            - `starts_with`: Prefix match (phone_number, address_postal_code)

            For `customer_property` filters, the allowed operators depend on the property's type:
            - `string`: `contains`, `is`, `exists`
            - `link`: `contains`, `is`, `exists`
            - `number`: `range`, `is`, `exists`
            - `timestamp`: `range`, `exists`
            - `bool`: `is`, `exists`
            - `text`: `contains` (matches whole words, no prefix matching), `exists`
        values:
          type: array
          maxItems: 200
          items:
            oneOf:
            - type: string
            - type: number
            - type: boolean
          description: The values to match when `operator` is `contains`, `is`, or
            `starts_with`. The API combines multiple values with OR logic. Each value
            for `starts_with` must contain at least 3 characters.
          example:
          - john
          - jane
        range:
          type: object
          properties:
            from:
              oneOf:
              - type: string
                format: date-time
              - type: integer
              - type: number
                format: double
              description: |
                Start of range (inclusive, gte).
                For date fields (last_activity, last_visit_started, last_chat_at, last_ticket_created_at, last_ticket_customer_message_at, cart_last_updated_at): use RFC3339 date-time strings (e.g., '2025-01-01T00:00:00Z').
                For timestamp customer properties: use an RFC3339 date-time string regardless of the property's configured format.
                For numeric fields (visits_count, threads_count, etc.): use integers.
                For cart value fields (cart_total_usd): use numbers (e.g., 50.00).
            to:
              oneOf:
              - type: string
                format: date-time
              - type: integer
              - type: number
                format: double
              description: |
                End of range (inclusive, lte).
                For date fields (last_activity, last_visit_started, last_chat_at, last_ticket_created_at, last_ticket_customer_message_at, cart_last_updated_at): use RFC3339 date-time strings (e.g., '2025-03-01T00:00:00Z').
                For timestamp customer properties: use an RFC3339 date-time string regardless of the property's configured format.
                For numeric fields (visits_count, threads_count, etc.): use integers.
                For cart value fields (cart_total_usd): use numbers (e.g., 200.00).
          description: |
            Range values for the `range` operator.
            For date fields (last_activity, last_visit_started, last_chat_at, last_ticket_created_at, last_ticket_customer_message_at, cart_last_updated_at), use RFC3339 date-time strings.
            For timestamp customer properties, always use RFC3339 date-time strings. The configured property format controls normalization:
            - `date-time`: compare the represented instant.
            - `date`: compare the RFC3339 value's local calendar date.
            - `time`: compare the RFC3339 value's local wall-clock time.
            For numeric fields (visits_count, threads_count, etc.), use integers.
            For cart value fields (cart_total_usd), use numbers.
          example:
            from: '2025-01-01T00:00:00Z'
            to: '2025-03-01T00:00:00Z'
        negate:
          type: boolean
          default: false
          description: If set to `true`, the API negates the filter result by applying
            NOT logic.
      example:
        field: name
        operator: contains
        values:
        - john
        - jane
    FilterGroup:
      type: object
      required:
      - operator
      - clauses
      properties:
        operator:
          type: string
          enum:
          - AND
          - OR
          description: The logical operator to combine clauses within this group.
        clauses:
          type: array
          minItems: 1
          description: The filter clauses to be combined with the specified operator.
          items:
            "$ref": "#/components/schemas/Clause"
      example:
        operator: AND
        clauses:
        - field: name
          operator: contains
          values:
          - john
        - field: email
          operator: exists
    CustomerSearchBase:
      type: object
      properties:
        query:
          type: string
          minLength: 3
          description: The free-text query to match against the `name`, `email`, `suggested_email`,
            and `phone_number` fields. The API excludes fields that are explicitly
            filtered.
          example: john smith
        filters:
          type: array
          description: An array of filter groups combined with `AND` logic.
          items:
            "$ref": "#/components/schemas/FilterGroup"
    ListCustomersRequest:
      allOf:
      - "$ref": "#/components/schemas/CustomerSearchBase"
      - type: object
        properties:
          results_per_page:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            description: "The number of results to return per page. \nDefault: 50.
              Maximum: 100.\n"
          sort:
            type: object
            description: |
              The sorting configuration (field -> order mapping).
              Each key is either a sortable field name or a customer property ID, and the key order sets the sort priority.
              Customer properties of type `text` are not sortable.
              Note: `created_at` is always appended as the final sort field to ensure stable pagination.
            additionalProperties:
              type: string
              enum:
              - asc
              - desc
            example:
              last_activity: desc
              9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11: asc
          page_id:
            type: string
            description: |
              The page identifier for pagination. Should be a numeric string starting from `"1"`.
              Use the `next_page_id` from the previous response to navigate to the next page.
              Example: `"1"`, `"2"`, `"3"`, etc.
            example: '1'
        example:
          query: john
          filters:
          - operator: AND
            clauses:
            - field: name
              operator: contains
              values:
              - john
              - jane
            - field: email
              operator: is
              values:
              - user@example.com
              - contact@example.com
            - field: country_code
              operator: is
              values:
              - US
              negate: true
            - field: last_activity
              operator: range
              range:
                from: '2025-01-01T00:00:00Z'
                to: '2025-03-01T00:00:00Z'
            - field: threads_count
              operator: range
              range:
                from: 50
                to: 100
            - field: cart_total_usd
              operator: range
              range:
                from: 50
                to: 200
            - field: cart_last_updated_at
              operator: range
              range:
                from: '2025-01-01T00:00:00Z'
                to: '2025-03-01T00:00:00Z'
            - field: segment_id
              operator: is
              values:
              - 0
              entered_at:
                from: '2025-01-01T00:00:00Z'
            - field: customer_property
              property_id: db34b1fe-22ce-4d41-bd0b-e15567f4c81b
              operator: is
              values:
              - gold
            - field: customer_property
              property_id: fa84b317-5b2b-4823-9b51-b7e2868d07b6
              operator: range
              range:
                from: 40
                to: 50
          - operator: OR
            clauses:
            - field: name
              operator: exists
            - field: email
              operator: exists
          results_per_page: 50
          sort:
            last_activity: desc
            9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11: asc
          page_id: '1'
    ListCustomersResponse:
      type: object
      required:
      - customers
      - total
      - page_id
      properties:
        customers:
          type: array
          items:
            "$ref": "#/components/schemas/Customer"
          description: An array of customer objects matching the search criteria.
        next_page_id:
          type: string
          description: The page identifier for the next page of results. Omitted when
            there are no more pages. To retrieve the next page, pass this value as
            `page_id` in the next request.
          example: '2'
        total:
          type: integer
          format: int32
          description: The total number of customers matching the search criteria.
          example: 1523
        page_id:
          type: string
          description: The current page identifier.
          example: '1'
    GetCustomersCountRequest:
      allOf:
      - "$ref": "#/components/schemas/CustomerSearchBase"

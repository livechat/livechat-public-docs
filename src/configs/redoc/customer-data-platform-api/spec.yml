---
openapi: 3.0.0
info:
  title: Customer Data Platform API
  description:
    Customer Data Platform API is a service for collecting, storing, and
    managing end-user data.
  version: 0.0.1
servers:
  - url: https://api.text.com/cdp
paths:
  "/get_customer":
    post:
      summary: Get customer
      description: "Returns the customer data. Required scope: `customers:ro`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The requested customer ID.
      responses:
        "200":
          description: Customer data.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "404":
          description: Customer not found
        "422":
          description: Invalid request body
        "500":
          description: Internal error
  "/get_merged_customer":
    post:
      summary: Get merged customer
      description: "Returns the merged customer data. Required scope: `customers:ro`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The requested customer ID.
      responses:
        "200":
          description: Merged customer data.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "404":
          description: Customer not found
        "422":
          description: Invalid request body
        "500":
          description: Internal error
  "/get_merged_customer_chats":
    post:
      summary: Get merged customer chat IDs
      description: "Returns the merged customer chat IDs. Required scope: `customers:ro`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The requested customer ID.
      responses:
        "200":
          description: Array of chat IDs for the merged customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chat_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                      description: The requested customer chat IDs.
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "404":
          description: Customer not found
        "422":
          description: Invalid request body
        "500":
          description: Internal error
  "/get_merged_customer_tickets":
    post:
      summary: Get merged customer ticket IDs
      description: "Returns the merged customer ticket IDs. Required scope: `customers:ro`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The requested customer ID.
                silo:
                  type: string
                  enum:
                    - inbox
                    - archive
                    - spam
                    - trash
                  description: An optional ticket silo filter.
      responses:
        "200":
          description: Array of ticket IDs for the merged customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                      description: The requested customer ticket IDs.
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "404":
          description: Customer not found
        "422":
          description: Invalid request body
        "500":
          description: Internal error
  "/v1/list_customers":
    post:
      summary: v1/List customers
      description:
        "Available for Text App only. Search and list customers with filtering,
        sorting, and pagination. Required scope: `customers:ro`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListCustomersRequest"
            examples:
              simple_search:
                summary: Simple free-text search
                value:
                  query: john
                  results_per_page: 50
              advanced_filters:
                summary: Advanced filtering with multiple criteria
                value:
                  query: john
                  filters:
                    - operator: AND
                      clauses:
                        - field: name
                          operator: contains
                          values:
                            - john
                            - jane
                        - field: country
                          operator: is
                          values:
                            - Poland
                            - Latvia
                          negate: true
                        - field: last_activity
                          operator: range
                          range:
                            from: "2025-01-01T00:00:00Z"
                            to: "2025-03-01T00:00:00Z"
                        - field: threads_count
                          operator: range
                          range:
                            from: 50
                            to: 100
                        - field: tickets_count
                          operator: is
                          values:
                            - 10
                  results_per_page: 50
                  sort:
                    last_activity: desc
              filter_groups_example:
                summary: Multiple filter groups with OR logic
                value:
                  filters:
                    - operator: AND
                      clauses:
                        - field: email
                          operator: is
                          values:
                            - user@example.com
                        - field: threads_count
                          operator: range
                          range:
                            from: 10
                            to: 100
                    - operator: OR
                      clauses:
                        - field: name
                          operator: exists
                        - field: phone_number
                          operator: starts_with
                          values:
                            - "+48"
                            - "+121"
                  results_per_page: 25
              cart_filters:
                summary: Filter by cart value and last updated date
                value:
                  filters:
                    - operator: AND
                      clauses:
                        - field: cart_total_usd
                          operator: range
                          range:
                            from: 100
                            to: 500
                        - field: cart_last_updated_at
                          operator: range
                          range:
                            from: "2025-01-01T00:00:00Z"
                            to: "2025-03-01T00:00:00Z"
                  results_per_page: 50
      responses:
        "200":
          description: A list of customers matching search criteria.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCustomersResponse"
              example:
                customers:
                  - customer_id: cf89fa3a-5ee9-4bdb-84ec-38824b2e2786
                    organization_id: b7eff798-f8df-4364-8052-649c35c9ed0c
                    product: livechat
                    monitoring:
                    custom_fields:
                    statistics:
                next_page_id: "2"
                total: 1523
                page_id: "1"
        "400":
          description: Invalid request (validation error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example:
                      "validation error: invalid field 'city'. Allowed fields:
                      name, email, phone_number, country, and statistics fields"
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "422":
          description: Invalid request body
        "500":
          description: Internal error
  "/v1/get_customers_count":
    post:
      summary: v1/Get customers count
      description:
        "Available for Text App only. Returns a count of customers matching
        the specified search criteria. The request body follows the same structure
        as `v1/list_customers`, but sorting and pagination parameters are ignored.
        Required scope: `customers:ro`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetCustomersCountRequest"
      responses:
        "200":
          description: The count of customers matching search criteria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int64
                    example: 1523
        "400":
          description: Invalid request (validation error)
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "422":
          description: Invalid request body
        "500":
          description: Internal error
  "/v1/create_customer_property_definition":
    post:
      summary: v1/Create customer property definition
      description:
        "Creates a new customer property schema entry for the caller's
        organization. The property `id` is a UUID generated by the store. A single
        organization can have at most 30 customer properties. Required scope: `customers:rw`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateCustomerPropertyRequest"
            examples:
              number_property:
                summary: Numeric property
                value:
                  name: lifetime_value
                  type: number
                  description: Lifetime spend in USD
              timestamp_property:
                summary: Timestamp property with a format
                value:
                  name: signed_up_at
                  type: timestamp
                  type_configuration:
                    format: date-time
      responses:
        "200":
          description: The created customer property.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerProperty"
              examples:
                number_property:
                  summary: Numeric property (no type_configuration)
                  value:
                    id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                    name: lifetime_value
                    type: number
                    type_configuration: {}
                    description: Lifetime spend in USD
                    has_value: false
                timestamp_property:
                  summary: Timestamp property with a format
                  value:
                    id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                    name: signed_up_at
                    type: timestamp
                    type_configuration:
                      format: date-time
                    has_value: false
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "409":
          description: A property with the same name already exists in the organization.
        "422":
          description:
            Invalid request body, the organization's customer properties
            limit (30) has been reached, or the resulting schema exceeds the upstream
            size limit.
        "500":
          description: Internal error
  "/v1/update_customer_property_definition":
    post:
      summary: v1/Update customer property definition
      description:
        "Updates the editable fields of an existing customer property.
        Only `name`, `description` and `type_configuration` can be changed; the `type`
        is immutable. Requests that include `type` (or any other unknown field) are
        rejected with a validation error. At least one of `name`, `description`, `type_configuration`
        must be provided. Required scope: `customers:rw`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateCustomerPropertyRequest"
            examples:
              renamed:
                summary: Rename a numeric property
                value:
                  id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                  name: ltv_usd
                  description: Lifetime value (USD)
              timestamp_property:
                summary: Update a timestamp property's format
                value:
                  id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                  type_configuration:
                    format: date
      responses:
        "200":
          description: The updated customer property.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerProperty"
              examples:
                renamed:
                  summary: Renamed numeric property
                  value:
                    id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                    name: ltv_usd
                    type: number
                    type_configuration: {}
                    description: Lifetime value (USD)
                    has_value: true
                timestamp_property:
                  summary: Timestamp property after updating its format
                  value:
                    id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                    name: signed_up_at
                    type: timestamp
                    type_configuration:
                      format: date
                    has_value: false
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "404":
          description: Customer property not found
        "409":
          description:
            Another property in the organization already uses the requested
            name.
        "422":
          description:
            Invalid request body (including attempts to set `type` or any
            other unknown field), or the resulting schema exceeds the upstream size
            limit.
        "500":
          description: Internal error
  "/v1/delete_customer_property_definition":
    post:
      summary: v1/Delete customer property definition
      description:
        "Deletes a customer property definition. It will no longer be returned
        by any definition-listing response. Required scope: `customers:rw`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DeleteCustomerPropertyRequest"
            examples:
              delete:
                summary: Remove a property
                value:
                  id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
      responses:
        "200":
          description: The property was deleted.
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "404":
          description: Customer property not found
        "422":
          description: Invalid request body
        "500":
          description: Internal error
  "/v1/get_customer_properties_definitions":
    post:
      summary: v1/List customer property definitions
      description:
        "Returns all customer property schema entries for the caller's
        organization, plus the schema-level `last_updated_at` timestamp and `last_updated_by`
        account ID of the most recent mutation. Required scope: `customers:ro`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: List of customer properties in the organization.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCustomerPropertiesResponse"
              example:
                last_updated_at: "2026-01-15T09:30:00Z"
                last_updated_by: 3ac8f2b1-1f6c-4a2b-8d0e-9b6f1f6c8a2b
                properties:
                  - id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
                    name: lifetime_value
                    type: number
                    type_configuration: {}
                    description: Lifetime spend in USD
                    has_value: true
                  - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                    name: signed_up_at
                    type: timestamp
                    type_configuration:
                      format: date-time
                    has_value: false
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "422":
          description: Invalid request body
        "500":
          description: Internal error
  "/v1/set_customer_properties_values":
    post:
      summary: v1/Set customer properties values
      description:
        "Sets one or more customer properties' values for the specified
        customer. Each property is validated against its definition (type and type
        configuration). Setting a property value to `null` clears it. Unknown fields
        in the request body are rejected. Required scope: `customers:rw`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetCustomerPropertiesValuesRequest"
            examples:
              set_multiple_properties:
                summary: Set multiple properties values
                value:
                  customer_id: cf89fa3a-5ee9-4bdb-84ec-38824b2e2786
                  properties:
                    9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11: 42
                    a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d: hello
              clear_property:
                summary: Clear the property value
                value:
                  customer_id: cf89fa3a-5ee9-4bdb-84ec-38824b2e2786
                  properties:
                    9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11:
      responses:
        "200":
          description: Properties have been set successfully. Empty response body.
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "422":
          description:
            Invalid request body (e.g. missing or empty `customer_id`,
            empty `properties` map, exceeding the properties limit, unknown property
            ID, or a value that does not match the property type).
        "500":
          description: Internal error
  "/v1/has_sales_events":
    post:
      summary: v1/Has sales events
      description:
        "Returns whether the organization has recorded any sales activity,
        optionally scoped to a single store. Required scope: `customers:ro`."
      parameters:
        - "$ref": "#/components/parameters/AuthHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                store_uuid:
                  type: string
                  format: uuid
                  description:
                    Optional store UUID. When provided the check is scoped
                    to that store; when omitted it covers the whole organization.
      responses:
        "200":
          description: Whether the organization (or store) has any sales events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_sales_events:
                    type: boolean
        "401":
          description: Invalid access token
        "403":
          description: Insufficient scopes
        "422":
          description: Invalid request body (e.g. malformed `store_uuid`).
        "500":
          description: Internal error
components:
  parameters:
    AuthHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description:
        A valid access token, either an OAuth2 Token (Bearer) or a Personal
        Access Token (Basic).
  schemas:
    Customer:
      type: object
      required:
        - customer_id
        - organization_id
        - product
        - monitoring
        - custom_fields
        - statistics
      properties:
        customer_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        product:
          type: string
          example: livechat
        monitoring:
          oneOf:
            - "$ref": "#/components/schemas/Monitoring"
            - type: "null"
        custom_fields:
          oneOf:
            - "$ref": "#/components/schemas/CustomFields"
            - type: "null"
        statistics:
          oneOf:
            - "$ref": "#/components/schemas/Statistics"
            - type: "null"
        chat:
          "$ref": "#/components/schemas/Chat"
        invitation:
          "$ref": "#/components/schemas/Invitation"
        customer_properties:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/CustomerPropertyValue"
          description:
            A map of customer property definition IDs to their current
            values. Omitted when the customer has no property values set.
        tickets:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/Ticket"
        omnichannel:
          "$ref": "#/components/schemas/Omnichannel"
        orders:
          type: array
          items:
            "$ref": "#/components/schemas/Order"
        carts:
          type: array
          items:
            "$ref": "#/components/schemas/Cart"
        segment_memberships:
          type: array
          items:
            "$ref": "#/components/schemas/SegmentMembership"
          description:
            The customer's per-segment membership state. Contains one entry
            for each segment that has been evaluated for the customer.
    Monitoring:
      type: object
      required:
        - name
        - name_is_default
        - email
        - avatar_url
        - phone_number
        - session_fields
        - visits
        - version
        - state
        - online
        - current_group_ids
        - created_at
        - master_id
      properties:
        name:
          type: string
        name_is_default:
          type: boolean
        email:
          type: string
        avatar_url:
          type: string
        phone_number:
          type: string
        session_fields:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
        visits:
          type: array
          items:
            "$ref": "#/components/schemas/Visit"
        version:
          type: integer
        state:
          "$ref": "#/components/schemas/MonitoringState"
        online:
          type: boolean
        current_group_ids:
          type: array
          items:
            type: integer
        created_at:
          type: string
          format: date-time
        master_id:
          type: string
          format: uuid
        address:
          "$ref": "#/components/schemas/Address"
    Address:
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        country:
          type: string
        state:
          type: string
        postal_code:
          type: string
    MonitoringState:
      type: string
      enum:
        - ""
        - browsing
        - queued
        - invited
        - chatting
        - chat closed
        - offline
    Visit:
      type: object
      required:
        - id
        - started_at
        - geolocation
      properties:
        id:
          type: integer
        started_at:
          type: string
        ended_at:
          type: string
        geolocation:
          "$ref": "#/components/schemas/Geolocation"
        ip:
          type: string
        user_agent:
          type: string
        page_referrer:
          type: string
        first_visited_page:
          "$ref": "#/components/schemas/Page"
        pages:
          type: array
          items:
            "$ref": "#/components/schemas/Page"
    Page:
      type: object
      required:
        - id
        - started_at
        - url
        - title
        - group_ids
      properties:
        id:
          type: integer
        started_at:
          type: string
        url:
          type: string
        title:
          type: string
        group_ids:
          type: array
          items:
            type: integer
    Geolocation:
      type: object
      required:
        - latitude
        - longitude
        - country
        - country_code
        - region
        - city
        - timezone
      properties:
        latitude:
          type: string
        longitude:
          type: string
        country:
          type: string
        country_code:
          type: string
        region:
          type: string
        city:
          type: string
        timezone:
          type: string
    CustomFields:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: string
      example:
        58737b5829e65621a45d598aa6f2ed8e:
          phone: 0300 222 0000
          address: Prime Minister's Office, 10 Downing Street
    Statistics:
      type: object
      required:
        - chats_count
        - threads_count
        - visits_count
        - page_views_count
        - greetings_accepted_count
        - greetings_converted_count
        - tickets_count
        - tickets_inbox_count
        - tickets_archive_count
        - tickets_spam_count
        - tickets_trash_count
        - orders_count
      properties:
        chats_count:
          type: integer
        threads_count:
          type: integer
        visits_count:
          type: integer
        page_views_count:
          type: integer
        greetings_accepted_count:
          type: integer
        greetings_converted_count:
          type: integer
        tickets_count:
          type: integer
        tickets_inbox_count:
          type: integer
        tickets_archive_count:
          type: integer
        tickets_spam_count:
          type: integer
        tickets_trash_count:
          type: integer
        orders_count:
          type: integer
        last_activity_at:
          type: string
          format: date-time
        last_visit_at:
          type: string
          format: date-time
        last_ticket_created_at:
          type: string
          format: date-time
        last_ticket_customer_message_at:
          type: string
          format: date-time
        last_chat_at:
          type: string
          format: date-time
        last_omnichannel_chat_at:
          type: string
          format: date-time
        last_campaign_interaction_at:
          type: string
          format: date-time
    Chat:
      type: object
      required:
        - active
        - chat_id
        - thread_id
        - last_updated_at
        - group_ids
      properties:
        active:
          type: boolean
        chat_id:
          type: string
        thread_id:
          format: string
        last_updated_at:
          type: string
          format: date-time
        group_ids:
          type: array
          items:
            type: integer
        source_customer_client_id:
          type: string
    Invitation:
      type: object

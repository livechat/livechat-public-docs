        - created_at
        - event_id
        - event_client_id
      properties:
        customer_id:
          type: string
          format: uuid
        store_platform:
          type: string
        store_uuid:
          type: string
          format: uuid
        order_id:
          type: string
        order_number:
          type: string
        currency:
          type: string
        total_price:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        event_id:
          type: string
          format: uuid
        event_client_id:
          type: string
        line_items:
          type: array
          items:
            "$ref": "#/components/schemas/OrderLineItem"
        source:
          type: string
    Cart:
      type: object
      required:
        - store_uuid
        - store_platform
        - customer_signed_in
        - subtotal
        - total
        - subtotal_usd
        - total_usd
        - currency
        - items
        - last_updated_at
      properties:
        store_uuid:
          type: string
          format: uuid
        store_platform:
          type: string
        customer_signed_in:
          type: boolean
        subtotal:
          type: number
          format: double
        total:
          type: number
          format: double
        subtotal_usd:
          type: number
          format: double
        total_usd:
          type: number
          format: double
        currency:
          type: string
        items:
          type: array
          items:
            "$ref": "#/components/schemas/CartItem"
        last_updated_at:
          type: string
          format: date-time
    CartItem:
      type: object
      required:
        - id
        - quantity
        - variant_id
      properties:
        id:
          type: integer
          format: int64
        quantity:
          type: integer
        variant_id:
          type: integer
          format: int64
        discounts:
          type: array
          items:
            type: string
    OrderLineItem:
      type: object
      required:
        - title
        - quantity
        - price
      properties:
        title:
          type: string
        quantity:
          type: integer
        price:
          type: number
          format: double
        sku:
          type: string
        variant_id:
          type: string
        product_id:
          type: string
    SegmentMembership:
      type: object
      required:
        - segment_id
        - is_member
      properties:
        segment_id:
          type: integer
          format: int64
          description:
            ID of the segment definition this membership refers to. For
            the default segment, the ID is 0.
          example: 0
        is_member:
          type: boolean
          description: Whether the customer currently satisfies the segment's conditions.
          example: true
        membership_last_updated_at:
          type: string
          format: date-time
          description:
            Timestamp of the last time `is_member` changed (the customer
            was added to or removed from the segment).
          example: "2026-07-13T13:11:21.187676Z"
        membership_attribution:
          type: array
          items:
            type: string
          description:
            Account IDs of the agents credited with the customer joining
            the segment. Populated only when an agent-driven update added the customer;
            empty for additions caused by customers setting their own data.
          example:
            - bc35115a-6f12-40b4-bbb0-8187b0f68c8e
        conditions_provenance:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/ConditionProvenance"
          description:
            Per-condition provenance, keyed by condition name (e.g. `email_set`,
            `phone_number_set`). An entry is present for each condition the customer
            currently satisfies.
          example:
            email_set:
              last_updated_at: "2026-07-15T09:31:45.075731Z"
              agent_account_id: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
              agent_client_id: 71d32c598862b01b9e2298281339dbc2
    ConditionProvenance:
      type: object
      required:
        - last_updated_at
      properties:
        last_updated_at:
          type: string
          format: date-time
          description: Timestamp of when this condition was last satisfied.
          example: "2026-07-13T13:11:21.187676Z"
        agent_account_id:
          type: string
          description:
            Account ID of the agent whose change satisfied this condition.
            Omitted when the change was not attributable to an agent.
          example: bc35115a-6f12-40b4-bbb0-8187b0f68c8e
        agent_client_id:
          type: string
          description:
            Client ID of the application which issued the token for agent
            who satisfied this condition. Omitted when the change was not attributable
            to an agent.
          example: 71d32c598862b01b9e2298281339dbc2
    CustomerPropertyValue:
      type: object
      required:
        - value
        - last_updated_at
      properties:
        value:
          description:
            The property value. Its type depends on the property definition
            (boolean, string, number, timestamp string, or link string). Null when
            the property has been cleared.
          nullable: true
        last_updated_at:
          type: string
          format: date-time
          description: Timestamp of the last update to this property value.
        last_updated_agent_account_id:
          type: string
          description:
            Account ID of the agent that last set this value. Omitted when
            the value was not set by an agent.
        last_updated_agent_client_id:
          type: string
          description:
            Client ID of the application that last set this value. Omitted
            when the value was not set by an agent.
    CustomerPropertyType:
      type: string
      enum:
        - bool
        - string
        - number
        - timestamp
        - link
      description: Type of the customer property value. Assigned at creation and immutable.
    CustomerPropertyTypeConfiguration:
      type: object
      description:
        Per-type configuration. `format` is exclusive to properties of
        type `timestamp` (sending a non-empty `format` for other types is rejected
        with `422`). `allowed_values`, when present, constrains the property to a
        predefined domain.
      example: {}
      properties:
        format:
          type: string
          enum:
            - date-time
            - date
            - time
          description:
            Optional rendering format for timestamp property values. Aligns
            with JSON Schema format keywords. When empty, raw stored timestamp values
            are returned. Present only for `timestamp` properties.
        allowed_values:
          type: array
          maxItems: 30
          items:
            description:
              A single accepted value, typed to match the property `type`
              (boolean, string, number, or a timestamp/link string). Stored as provided;
              a value being set is matched against this set exactly.
          description:
            Optional domain of accepted values. When present, setting a
            value outside this set is rejected with `422`; `null` (clearing the value)
            is always allowed. The property remains single-valued — this is a set
            of allowed values, not a multi-value type. On create the full set is provided
            wholesale; exact duplicates and empty/`null` entries are rejected, and
            at most 30 entries are allowed. Changing the domain does not backfill
            or alter existing customer values, which are still returned even if they
            no longer match.
    CustomerPropertyTypeConfigurationUpdate:
      type: object
      description:
        "`format` and `allowed_values` are updated independently: omitting
        a field leaves its current value unchanged; providing it (including an empty
        array for `allowed_values` or an empty string for `format`) replaces or clears
        it."
      example: {}
      properties:
        format:
          type: string
          enum:
            - date-time
            - date
            - time
          description:
            New rendering format for timestamp property values, replacing
            the current one. Send an empty string to clear a previously configured
            format. Only allowed for `timestamp` properties.
        allowed_values:
          type: array
          maxItems: 30
          items:
            description:
              A single accepted value, typed to match the property `type`
              (boolean, string, number, or a timestamp/link string).
          description:
            Replaces the current domain of accepted values wholesale. Send
            an empty array to clear the domain. Exact duplicates and empty/`null`
            entries are rejected, and at most 30 entries are allowed.
    CustomerProperty:
      type: object
      description:
        A customer property definition. `type_configuration` carries a
        `format` only when `type` is `timestamp`, and may carry `allowed_values` for
        any type; it is an empty object (`{}`) when neither applies.
      required:
        - id
        - name
        - type
        - type_configuration
        - has_value
      example:
        id: 9b1c9e0a-3a4b-4f0e-9b6f-1f6c8a2b0d11
        name: lifetime_value
        type: number
        type_configuration: {}
        description: Lifetime spend in USD
        has_value: true
      properties:
        id:
          type: string
          format: uuid
          description: UUID generated by the store.
        name:
          type: string
          maxLength: 128
          description: Human-readable property name, unique within the organization.
        type:
          "$ref": "#/components/schemas/CustomerPropertyType"
        type_configuration:
          "$ref": "#/components/schemas/CustomerPropertyTypeConfiguration"
        description:
          type: string
          maxLength: 512
        has_value:
          type: boolean
          description: Whether at least one customer has a value set for this property.
    CreateCustomerPropertyRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          maxLength: 128
          description: Property name, must be non-empty and unique within the organization.
        type:
          "$ref": "#/components/schemas/CustomerPropertyType"
        type_configuration:
          "$ref": "#/components/schemas/CustomerPropertyTypeConfiguration"
        description:
          type: string
          maxLength: 512
    UpdateCustomerPropertyRequest:
      type: object
      required:
        - id
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the property to update.
        name:
          type: string
          maxLength: 128
          description: New name. Must be unique within the organization.
        description:
          type: string
          maxLength: 512
        type_configuration:
          "$ref": "#/components/schemas/CustomerPropertyTypeConfigurationUpdate"
      description:
        At least one of `name`, `description`, `type_configuration` must
        be provided. The `type` field is intentionally absent — type is immutable,
        and any unknown field (including `type`) causes the request to be rejected
        with a validation error. Within `type_configuration`, `format` and `allowed_values`
        are updated independently — omit one to leave it unchanged while replacing
        the other; see `CustomerPropertyTypeConfigurationUpdate`. `type_configuration.format`
        is only allowed for properties of type `timestamp`; set it to an empty string
        to clear a previously configured format.
    DeleteCustomerPropertyRequest:
      type: object
      required:
        - id
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the property to delete.
    ListCustomerPropertiesResponse:
      type: object
      required:
        - properties
      properties:
        last_updated_at:
          type: string
          format: date-time
          description:
            Timestamp of the most recent create or update operation on
            the organization's customer property schema. Omitted when the organization
            has never had any properties.
        last_updated_by:
          type: string
          description:
            Account ID (from the SSO token) of the actor that last mutated
            the schema. Omitted when the organization has never had any properties.
        properties:
          type: array
          items:
            "$ref": "#/components/schemas/CustomerProperty"
    SetCustomerPropertiesValuesRequest:
      type: object
      required:
        - customer_id
        - properties
      additionalProperties: false
      properties:
        customer_id:
          type: string
          description:
            The customer whose property values should be set. Must not
            be empty.
        properties:
          type: object
          additionalProperties:
            description:
              "Property value keyed by property definition ID. The value
              type must match the property's defined type: boolean for `bool`, string
              (max 2048 chars) for `string`, number for `number`, RFC 3339 / date
              / time string for `timestamp` (depending on type configuration format),
              or a valid HTTP(S) URL string (max 2048 chars) for `link`. Use `null`
              to clear a property value."
          description: A map of property definition IDs to their values.
    Clause:
      type: object
      required:
        - operator
      properties:
        field:
          type: string
          enum:
            - name
            - email
            - phone_number
            - phone_number_country_code
            - country
            - country_code
            - last_activity
            - last_visit_started
            - visits_count
            - page_views_count
            - chats_count
            - threads_count
            - greetings_accepted_count
            - greetings_converted_count
            - tickets_count
            - tickets_inbox_count
            - tickets_archive_count
            - tickets_spam_count
            - tickets_trash_count
            - orders_count
            - cart_last_updated_at
            - cart_total_usd
            - address_street
            - address_city
            - address_country
            - address_state
            - address_postal_code
            - customer_property
          description: |
            Field name to filter on (required for all operators).
            Use `customer_property` to filter on a custom customer property; in that
            case `property_id` is required.
        property_id:
          type: string
          description: |
            ID of the customer property definition to filter on.
            Required when `field` is `customer_property`; ignored for built-in fields.
            An unknown `property_id` is rejected with a validation error.
          example: db34b1fe-22ce-4d41-bd0b-e15567f4c81b
        operator:
          type: string
          enum:
            - contains
            - is
            - range
            - exists
            - starts_with
          description: |
            Filter operator:
            - `exists`: Check if field exists/is populated (name, email, phone_number, address_street, address_city, address_country, address_state, address_postal_code)
            - `contains`: Partial string matching (name, email, phone_number, address_street, address_city, address_country, address_state, address_postal_code)
            - `is`: Exact match for single or multiple values (all fields)
            - `range`: Range filter for dates, numbers, or cart values (statistics fields, cart fields)
            - `starts_with`: Prefix match (phone_number, address_postal_code)

            For `customer_property` filters, the allowed operators depend on the property's type:
            - `string`: `contains`, `is`, `exists`
            - `link`: `contains`, `is`, `exists`
            - `number`: `range`, `is`, `exists`
            - `timestamp`: `range`, `exists`
            - `bool`: `is`, `exists`
        values:
          type: array
          items:
            type: string
          description: |
            Array of values for operators: contains, is, starts_with.
            Multiple values are combined with OR logic.
            Maximum number of elements: 200.
            - For 'starts_with' operator: minimum 3 characters per value
          example:
            - john
            - jane
        range:
          type: object
          properties:
            from:
              oneOf:
                - type: string
                  format: date-time
                - type: integer
                - type: number
                  format: double
              description: |
                Start of range (inclusive, gte).
                For date fields (last_activity, last_visit_started, cart_last_updated_at): use RFC3339 date-time strings (e.g., '2025-01-01T00:00:00Z').
                For numeric fields (visits_count, threads_count, etc.): use integers.
                For cart value fields (cart_total_usd): use numbers (e.g., 50.00).
            to:
              oneOf:
                - type: string
                  format: date-time
                - type: integer
                - type: number
                  format: double
              description: |
                End of range (inclusive, lte).
                For date fields (last_activity, last_visit_started, cart_last_updated_at): use RFC3339 date-time strings (e.g., '2025-03-01T00:00:00Z').
                For numeric fields (visits_count, threads_count, etc.): use integers.
                For cart value fields (cart_total_usd): use numbers (e.g., 200.00).
          description:
            "Range values for 'range' operator. For date fields (last_activity,
            last_visit_started, cart_last_updated_at): use RFC3339 format date-time
            strings. For numeric fields (visits_count, threads_count, etc.): use
            integers. For cart value fields (cart_total_usd): use numbers."
          example:
            from: "2025-01-01T00:00:00Z"
            to: "2025-03-01T00:00:00Z"
        negate:
          type: boolean
          default: false
          description: Negate the filter (apply NOT logic)
      example:
        field: name
        operator: contains
        values:
          - john
          - jane
    FilterGroup:
      type: object
      required:
        - operator
        - clauses
      properties:
        operator:
          type: string
          enum:
            - AND
            - OR
          description: The logical operator to combine clauses within this group.
        clauses:
          type: array
          minItems: 1
          description: The filter clauses to be combined with the specified operator.
          items:
            "$ref": "#/components/schemas/Clause"
      example:
        operator: AND
        clauses:
          - field: name
            operator: contains
            values:
              - john
          - field: email
            operator: exists
    CustomerSearchBase:
      type: object
      properties:
        query:
          type: string
          minLength: 3
          description: |
            A free-text search query across `name`, `email`, and `phone_number` fields.
            Automatically excludes fields that are explicitly filtered.
            Minimum length: 3 characters.
          example: john smith
        filters:
          type: array
          description: An array of filter groups combined with `AND` logic.
          items:
            "$ref": "#/components/schemas/FilterGroup"
    ListCustomersRequest:
      allOf:
        - "$ref": "#/components/schemas/CustomerSearchBase"
        - type: object
          properties:
            results_per_page:
              type: integer
              minimum: 1
              maximum: 100
              default: 50
              description:
                "The number of results to return per page. Default: 50.
                Maximum: 100."
            sort:
              type: object
              description:
                "The sorting configuration (field -> order mapping). Multiple
                sort fields can be specified. Note: `created_at` is always appended
                as the final sort field to ensure stable pagination."
              additionalProperties:
                type: string
                enum:
                  - asc
                  - desc
              example:
                last_activity: desc
                name: asc
            page_id:
              type: string
              description: |
                The page identifier for pagination. Should be a numeric string starting from `"1"`.
                Use the `next_page_id` from the previous response to navigate to the next page.
                Example: `"1"`, `"2"`, `"3"`, etc.
              example: "1"
          example:
            query: john
            filters:
              - operator: AND
                clauses:
                  - field: name
                    operator: contains
                    values:
                      - john
                      - jane
                  - field: email
                    operator: is
                    values:
                      - user@example.com
                      - contact@example.com
                  - field: country_code
                    operator: is
                    values:
                      - US
                    negate: true
                  - field: last_activity
                    operator: range
                    range:
                      from: "2025-01-01T00:00:00Z"
                      to: "2025-03-01T00:00:00Z"
                  - field: threads_count
                    operator: range
                    range:
                      from: 50
                      to: 100
                  - field: cart_total_usd
                    operator: range
                    range:
                      from: 50
                      to: 200
                  - field: cart_last_updated_at
                    operator: range
                    range:
                      from: "2025-01-01T00:00:00Z"
                      to: "2025-03-01T00:00:00Z"
                  - field: customer_property
                    property_id: db34b1fe-22ce-4d41-bd0b-e15567f4c81b
                    operator: is
                    values:
                      - gold
                  - field: customer_property
                    property_id: fa84b317-5b2b-4823-9b51-b7e2868d07b6
                    operator: range
                    range:
                      from: 40
                      to: 50
              - operator: OR
                clauses:
                  - field: name
                    operator: exists
                  - field: email
                    operator: exists
            results_per_page: 50
            sort:
              last_activity: desc
              name: asc
            page_id: "1"
    ListCustomersResponse:
      type: object
      required:
        - customers
        - total
        - page_id
      properties:
        customers:
          type: array
          items:
            "$ref": "#/components/schemas/Customer"
          description: An array of customer objects matching the search criteria.
        next_page_id:
          type: string
          description: |
            The page identifier for the next page of results.
            Empty string if there are no more pages.
            Pass this value as `page_id` in the next request to retrieve the next page.
          example: "2"
        total:
          type: integer
          format: int32
          description: The total number of customers matching the search criteria.
          example: 1523
        page_id:
          type: string
          description: The current page identifier.
          example: "1"
    GetCustomersCountRequest:
      allOf:
        - "$ref": "#/components/schemas/CustomerSearchBase"
